name: Deploy PCS Studio Preview

on:
  push:
    branches:
      - feature/pcs-studio-preview
    paths:
      - "studio/**"
      - ".github/workflows/pcs-studio-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pcs-studio-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload PCS Studio
        uses: actions/upload-pages-artifact@v3
        with:
          path: studio
      - name: Deploy PCS Studio
        id: deployment
        uses: actions/deploy-pages@v4

name: Frontend Validation

on:
  push:
    branches:
      - main
      - "feature/**"
      - "work/**"
      - "fix/**"
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-validation.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend validation (${{ matrix.timezone }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        timezone:
          - UTC
          - Asia/Tehran
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: frontend
        run: npm install --package-lock=false --legacy-peer-deps --no-audit --no-fund

      - name: Generate synchronized npm lockfile (UTC job only)
        if: matrix.timezone == 'UTC'
        working-directory: frontend
        run: npm install --package-lock-only --legacy-peer-deps --no-audit --no-fund

      - name: Upload synchronized npm lockfile
        if: matrix.timezone == 'UTC'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package-lock
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Commit synchronized npm lockfile (one-time bootstrap)
        if: matrix.timezone == 'UTC'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already synchronized"
          else
            git commit -m "build(frontend): synchronize npm package lock"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Print npm diagnostics on install failure
        if: failure()
        working-directory: frontend
        run: |
          find ~/.npm/_logs -type f -name '*debug-0.log' -print -exec tail -n 120 {} \;

      - name: Run tests
        working-directory: frontend
        run: npm run test:run

      - name: Run lint
        working-directory: frontend
        run: npm run lint

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

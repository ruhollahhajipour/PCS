name: Frontend Validation

on:
  push:
    branches:
      - main
      - "feature/**"
      - "work/**"
      - "fix/**"
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-validation.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend validation (${{ matrix.timezone }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        timezone:
          - UTC
          - Asia/Tehran
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: frontend
        run: npm install --package-lock=false --legacy-peer-deps --no-audit --no-fund

      - name: Print npm diagnostics on install failure
        if: failure()
        working-directory: frontend
        run: |
          find ~/.npm/_logs -type f -name '*debug-0.log' -print -exec tail -n 120 {} \;

      - name: Run tests
        working-directory: frontend
        run: npm run test:run

      - name: Run lint
        working-directory: frontend
        run: npm run lint

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

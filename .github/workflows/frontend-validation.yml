name: Frontend Validation

on:
  push:
    branches:
      - main
      - "feature/**"
      - "work/**"
      - "fix/**"
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-validation.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests, lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Run tests
        working-directory: frontend
        run: npm run test:run

      - name: Run lint
        working-directory: frontend
        run: npm run lint

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

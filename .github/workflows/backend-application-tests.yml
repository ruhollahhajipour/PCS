name: Backend Application Tests

on:
  push:
    branches:
      - main
      - "feature/**"
      - "work/**"
      - "fix/**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-application-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-application-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solution-build:
    name: .NET 10 solution build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore backend/PCS.Backend.slnx

      - name: Build solution
        run: dotnet build backend/PCS.Backend.slnx --configuration Release --no-restore

  application-tests:
    name: Application regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install fonts required by PDF tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-core
          fc-match "Noto Sans Arabic"

      - name: Restore test project
        run: dotnet restore backend/tests/PCS.Application.Tests/PCS.Application.Tests.csproj

      - name: Build and run tests
        run: dotnet test backend/tests/PCS.Application.Tests/PCS.Application.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=pcs-application-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcs-application-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

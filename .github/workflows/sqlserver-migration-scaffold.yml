name: SQL Server Migration Scaffold

on:
  push:
    branches:
      - "feature/project-planning-architecture"
    paths:
      - "backend/src/PCS.Infrastructure.Migrations.SqlServer/PCS.Infrastructure.Migrations.SqlServer.csproj"
      - "backend/src/PCS.Infrastructure.Migrations.SqlServer/**"
      - "backend/src/PCS.Infrastructure/Persistence/DatabaseProviderResolver.cs"
      - "backend/src/PCS.Infrastructure/Persistence/PCSDbContext.cs"
      - "backend/src/PCS.Infrastructure/Migrations/**"
      - "backend/src/PCS.API/PCS.API.csproj"
      - "backend/src/PCS.Installer/PCS.Installer.csproj"
      - "backend/src/PCS.Installer/Services/Database/DatabaseInstallerService.cs"
      - ".github/workflows/sqlserver-migration-scaffold.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sqlserver-migration-scaffold-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scaffold-and-verify:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore backend/PCS.Backend.slnx

      - name: Install EF Core CLI
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.10
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify SQL Server migration artifacts
        shell: pwsh
        run: |
          $migration = "backend/src/PCS.Infrastructure.Migrations.SqlServer/Migrations/20261101235457_InitialSqlServer.cs"
          $designer = "backend/src/PCS.Infrastructure.Migrations.SqlServer/Migrations/20261101235457_InitialSqlServer.Designer.cs"
          $snapshot = "backend/src/PCS.Infrastructure.Migrations.SqlServer/Migrations/PCSDbContextModelSnapshot.cs"

          foreach ($file in @($migration, $designer, $snapshot)) {
            if (-not (Test-Path $file)) {
              throw "Required SQL Server migration artifact is missing: $file"
            }
          }

          $filter = "[IsPrimaryAdmin] = 1 AND [IsActive] = 1"
          if (-not (Select-String -Path $migration -SimpleMatch $filter -Quiet)) {
            throw "SQL Server migration does not contain the active primary-admin unique index filter."
          }

          if (-not (Select-String -Path $snapshot -SimpleMatch $filter -Quiet)) {
            throw "SQL Server model snapshot does not contain the active primary-admin unique index filter."
          }

          Write-Host "SQL Server migration artifacts and tenant membership index filter are verified."

      - name: Refresh provider-specific tenant filter snapshots
        shell: pwsh
        env:
          Jwt__Secret: "PCS-CI-ONLY-DESIGN-TIME-SECRET-DO-NOT-USE-IN-PRODUCTION-0000000000000000"
        run: |
          $sqliteProject = "backend/src/PCS.Infrastructure/PCS.Infrastructure.csproj"
          $sqlServerProject = "backend/src/PCS.Infrastructure.Migrations.SqlServer/PCS.Infrastructure.Migrations.SqlServer.csproj"
          $startupProject = "backend/src/PCS.API/PCS.API.csproj"
          $changed = $false

          $env:Database__Provider = "Sqlite"
          $env:ConnectionStrings__DefaultConnection = "Data Source=$env:RUNNER_TEMP\pcs-sqlite-design.db"
          if (-not (Get-ChildItem "backend/src/PCS.Infrastructure/Migrations" -Filter "*_TenantScopeAndEvmPrecision.cs" -ErrorAction SilentlyContinue)) {
            dotnet ef migrations add TenantScopeAndEvmPrecision --project $sqliteProject --startup-project $startupProject --context PCSDbContext --output-dir Migrations --configuration Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $changed = $true
          }

          $env:Database__Provider = "SqlServer"
          $env:ConnectionStrings__DefaultConnection = "Server=(localdb)\MSSQLLocalDB;Database=PCS_MigrationDesign;Integrated Security=True;TrustServerCertificate=True"
          if (-not (Get-ChildItem "backend/src/PCS.Infrastructure.Migrations.SqlServer/Migrations" -Filter "*_TenantScopeAndEvmPrecision.cs" -ErrorAction SilentlyContinue)) {
            dotnet ef migrations add TenantScopeAndEvmPrecision --project $sqlServerProject --startup-project $startupProject --context PCSDbContext --output-dir Migrations --configuration Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $changed = $true
          }

          if ($changed) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/src/PCS.Infrastructure/Migrations backend/src/PCS.Infrastructure.Migrations.SqlServer/Migrations
            git commit -m "chore(db): sync provider snapshots for tenant query filters"
            git push origin "HEAD:$env:GITHUB_REF_NAME"
          }
          else {
            Write-Host "Provider migration snapshots already include tenant query filters."
          }

      - name: Apply SQLite migrations to an ephemeral database
        shell: pwsh
        env:
          Database__Provider: Sqlite
          ConnectionStrings__DefaultConnection: "Data Source=pcs-sqlite-migration-test.db"
          Jwt__Secret: "PCS-CI-ONLY-DESIGN-TIME-SECRET-DO-NOT-USE-IN-PRODUCTION-0000000000000000"
        run: |
          dotnet ef database update --project backend/src/PCS.Infrastructure/PCS.Infrastructure.csproj --startup-project backend/src/PCS.API/PCS.API.csproj --context PCSDbContext --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit background-job call sites
        shell: pwsh
        run: |
          $references = git grep -n -E 'IBackgroundJobService|BackgroundJob[.]|RecurringJob[.]|Hangfire' -- backend/src ':!**/HangfireBackgroundJobService.cs' ':!**/IBackgroundJobService.cs' ':!**/DependencyInjection.cs' ':!**/PCS.Infrastructure.csproj'
          $grepExitCode = $LASTEXITCODE

          if ($grepExitCode -eq 0) {
            Write-Host "Background-job consumers or direct Hangfire references were found:"
            $references | Write-Output
            exit 0
          }

          if ($grepExitCode -eq 1) {
            Write-Host "No background-job consumers or direct Hangfire references were found."
            exit 0
          }

          exit $grepExitCode

      - name: Build solution
        run: dotnet build backend/PCS.Backend.slnx --configuration Release --no-restore

      - name: Run application regression tests
        run: dotnet test backend/tests/PCS.Application.Tests/PCS.Application.Tests.csproj --configuration Release --no-restore

  sqlserver-integration:
    name: SQL Server migration integration test
    needs: scaffold-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: "PcsCiOnly!Password2026#"
        ports:
          - 1433:1433
    env:
      Database__Provider: SqlServer
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=PCS_MigrationTest;User Id=sa;Password=PcsCiOnly!Password2026#;TrustServerCertificate=True;Encrypt=False"
      Jwt__Secret: "PCS-CI-ONLY-DESIGN-TIME-SECRET-DO-NOT-USE-IN-PRODUCTION-0000000000000000"
    steps:
      - name: Checkout latest branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore API
        run: dotnet restore backend/src/PCS.API/PCS.API.csproj

      - name: Install EF Core CLI
        shell: bash
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.10
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build API and SQL Server migrations
        run: dotnet build backend/src/PCS.API/PCS.API.csproj --configuration Release

      - name: Apply migrations to SQL Server
        shell: bash
        run: |
          for attempt in $(seq 1 18); do
            if dotnet ef database update --project backend/src/PCS.Infrastructure.Migrations.SqlServer/PCS.Infrastructure.Migrations.SqlServer.csproj --startup-project backend/src/PCS.API/PCS.API.csproj --context PCSDbContext --configuration Release --no-build; then
              exit 0
            fi
            echo "SQL Server is not ready yet (attempt $attempt/18); retrying in 10 seconds."
            sleep 10
          done
          echo "SQL Server migration did not complete."
          exit 1

      - name: Verify applied migration history
        run: dotnet ef migrations list --project backend/src/PCS.Infrastructure.Migrations.SqlServer/PCS.Infrastructure.Migrations.SqlServer.csproj --startup-project backend/src/PCS.API/PCS.API.csproj --context PCSDbContext --configuration Release --no-build

      - name: Build backend API container image
        run: docker build --file backend/Dockerfile --tag pcs-api:ci backend

      - name: Start API container and verify readiness
        shell: bash
        run: |
          JWT_SECRET="$(openssl rand -hex 32)"
          ADMIN_PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$ADMIN_PASSWORD"

          docker run --detach --name pcs-api-ci --network host \
            --env ASPNETCORE_URLS=http://+:8080 \
            --env Hosting__Mode=Cloud \
            --env Database__Provider=SqlServer \
            --env "ConnectionStrings__DefaultConnection=$ConnectionStrings__DefaultConnection" \
            --env "Jwt__Secret=$JWT_SECRET" \
            --env "InitialAdmin__Username=ci-admin" \
            --env "InitialAdmin__Password=$ADMIN_PASSWORD" \
            --env "InitialAdmin__FirstName=CI" \
            --env "InitialAdmin__LastName=Administrator" \
            --env "InitialAdmin__Email=ci-admin@example.invalid" \
            --env Cors__AllowedOrigins__0=https://ci.example.invalid \
            pcs-api:ci

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health/ready; then
              echo "PCS API readiness check succeeded."
              docker rm --force pcs-api-ci
              exit 0
            fi
            sleep 5
          done

          docker logs pcs-api-ci
          docker rm --force pcs-api-ci
          exit 1

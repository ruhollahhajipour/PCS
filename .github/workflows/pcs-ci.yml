name: PCS Continuous Integration

on:
  push:
    branches:
      - "feature/**"
      - "work/**"
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/pcs-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/pcs-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/PCS.Backend.slnx

      - name: Build Release
        run: dotnet build backend/PCS.Backend.slnx --configuration Release --no-restore

      - name: Run Application tests
        run: dotnet test backend/tests/PCS.Application.Tests/PCS.Application.Tests.csproj --configuration Release --no-restore

      - name: Run API authorization tests when present
        shell: pwsh
        run: |
          $project = "backend/tests/PCS.API.Tests/PCS.API.Tests.csproj"
          if (Test-Path $project) {
            dotnet test $project --configuration Release --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "API authorization test project is not present on this ref; skipped."
          }

  frontend:
    name: Frontend (React / TypeScript)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and production build
        run: npm run build

      - name: ESLint
        run: npm run lint

      - name: Frontend regression tests
        run: npm run test:run

      - name: Reject preview authentication bypass
        working-directory: .
        shell: pwsh
        run: |
          $scan = Start-Process -FilePath "git" -ArgumentList @("grep", "-n", "-I", "__PCS_PREVIEW_AUTH_BYPASS__", "--", "frontend") -NoNewWindow -Wait -PassThru -RedirectStandardOutput "preview-bypass-matches.txt"
          $grepExitCode = $scan.ExitCode
          if ($grepExitCode -eq 0) {
            $matchDetails = Get-Content preview-bypass-matches.txt -Raw
            throw "Preview authentication bypass must never enter a release candidate. Matches: $matchDetails"
          }
          if ($grepExitCode -ne 1) {
            throw "Preview bypass scan failed with exit code $grepExitCode."
          }

      - name: Upload preview bypass scan diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-bypass-scan
          path: preview-bypass-matches.txt
          if-no-files-found: ignore

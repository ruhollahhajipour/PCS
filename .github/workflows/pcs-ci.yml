name: PCS Continuous Integration

on:
  push:
    branches:
      - "feature/**"
      - "work/**"
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/pcs-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/pcs-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/PCS.Backend.slnx

      - name: Build Release
        run: dotnet build backend/PCS.Backend.slnx --configuration Release --no-restore

      - name: Run Application tests
        run: dotnet test backend/tests/PCS.Application.Tests/PCS.Application.Tests.csproj --configuration Release --no-restore

      - name: Run API authorization tests when present
        shell: pwsh
        run: |
          $project = "backend/tests/PCS.API.Tests/PCS.API.Tests.csproj"
          if (Test-Path $project) {
            dotnet test $project --configuration Release --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "API authorization test project is not present on this ref; skipped."
          }

  frontend:
    name: Frontend (React / TypeScript)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and production build
        run: npm run build

      - name: ESLint
        run: npm run lint

      - name: Frontend regression tests
        run: npm run test:run

      - name: Reject preview authentication bypass
        working-directory: .
        shell: pwsh
        run: |
          git grep -n "__PCS_PREVIEW_AUTH_BYPASS__" -- frontend
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Preview authentication bypass must never enter a release candidate."
            exit 1
          }
          if ($LASTEXITCODE -ne 1) {
            exit $LASTEXITCODE
          }
  
  sync_frontend_lockfile:
    name: Sync frontend lockfile on development work branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/work/pcs-ci-baseline-2026-10-31'
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile only when changed
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'frontend/package-lock.json';
            const branch = context.ref.replace('refs/heads/', '');
            const content = fs.readFileSync(path);
            const current = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: branch
            });
            const existing = Buffer.from(current.data.content, 'base64');
            if (existing.equals(content)) {
              core.info('Frontend lockfile is already synchronized.');
              return;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'chore(frontend): synchronize npm lockfile',
              content: content.toString('base64'),
              sha: current.data.sha,
              branch
            });
            core.info('Updated frontend/package-lock.json on the isolated work branch.');

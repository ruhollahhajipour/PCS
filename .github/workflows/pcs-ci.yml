name: PCS Continuous Integration

on:
  push:
    branches:
      - "feature/**"
      - "work/**"
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/pcs-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/pcs-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/PCS.Backend.slnx

      - name: Build Release
        run: dotnet build backend/PCS.Backend.slnx --configuration Release --no-restore

      - name: Run Application tests
        run: dotnet test backend/tests/PCS.Application.Tests/PCS.Application.Tests.csproj --configuration Release --no-restore

      - name: Run API authorization tests when present
        shell: pwsh
        run: |
          $project = "backend/tests/PCS.API.Tests/PCS.API.Tests.csproj"
          if (Test-Path $project) {
            dotnet test $project --configuration Release --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "API authorization test project is not present on this ref; skipped."
          }

  frontend:
    name: Frontend (React / TypeScript)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and production build
        run: npm run build

      - name: ESLint
        run: npm run lint

      - name: Frontend regression tests
        run: npm run test:run

      - name: Reject preview authentication bypass
        working-directory: .
        shell: pwsh
        run: |
          # PowerShell 7.4 can treat native-command exit code 1 as an error.
          # git grep uses exit code 1 for the normal "no matches" result.
          $PSNativeCommandUseErrorActionPreference = $false
          $matches = git grep -n "__PCS_PREVIEW_AUTH_BYPASS__" -- frontend
          $grepExitCode = $LASTEXITCODE

          if ($grepExitCode -eq 0) {
            $matches | ForEach-Object { Write-Host $_ }
            throw "Preview authentication bypass must never enter a release candidate."
          }

          if ($grepExitCode -ne 1) {
            throw "git grep failed with exit code $grepExitCode."
          }

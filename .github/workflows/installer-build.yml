name: Installer Build and Smoke Test

on:
  push:
    branches:
      - "ai/**"
      - "feature/project-planning-architecture"
    paths:
      - "installer/**"
      - "backend/src/PCS.Installer/**"
      - "backend/src/PCS.Launcher/**"
      - "backend/src/PCS.API/**"
      - "backend/src/PCS.Infrastructure/**"
      - "frontend/**"
      - ".github/workflows/installer-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Build PCSSetup.exe and smoke-test the installed layout
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build release (frontend, API, launcher, installer)
        shell: pwsh
        run: ./installer/scripts/build-release.ps1

      - name: Upload PCSSetup.exe
        uses: actions/upload-artifact@v4
        with:
          name: PCSSetup
          path: backend/src/PCS.Installer/Setup/PCSSetup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Install EF Core CLI
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.10
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # The wizard cannot run headless, so reproduce what it lays down:
      #   <root>\Backend (API + appsettings.json), <root>\Frontend, <root>\Database.
      - name: Smoke test installed layout (SQLite)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installRoot = Join-Path $env:RUNNER_TEMP "PCS"
          $backendDir  = Join-Path $installRoot "Backend"
          $frontendDir = Join-Path $installRoot "Frontend"
          $dbDir       = Join-Path $installRoot "Database"
          New-Item -ItemType Directory -Force $backendDir, $frontendDir, $dbDir | Out-Null

          Copy-Item "backend/publish/PCS.API/*" $backendDir -Recurse
          Copy-Item "frontend/dist/*" $frontendDir -Recurse

          $secretBytes = New-Object byte[] 64
          [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($secretBytes)
          $jwtSecret = [Convert]::ToBase64String($secretBytes)
          $adminPassword = "Smoke-" + [Guid]::NewGuid().ToString("N") + "!aA1"
          $dbFile = Join-Path $dbDir "pcs.db"
          $connection = "Data Source=$dbFile"

          $settings = @{
            Hosting = @{ Mode = "OnPremise" }
            Database = @{ Provider = "Sqlite" }
            ConnectionStrings = @{ DefaultConnection = $connection }
            Jwt = @{ Secret = $jwtSecret; Issuer = "PCS"; Audience = "PCS"; ExpirationMinutes = 480 }
            InitialAdmin = @{ Username = "admin"; Password = $adminPassword; FirstName = "PCS"; LastName = "Administrator"; Email = "admin@pcs.local" }
          }
          $settings | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $backendDir "appsettings.json") -Encoding utf8

          # The installer applies migrations before first start; do the same here.
          $env:Database__Provider = "Sqlite"
          $env:ConnectionStrings__DefaultConnection = $connection
          $env:Jwt__Secret = $jwtSecret
          dotnet ef database update `
            --project backend/src/PCS.Infrastructure/PCS.Infrastructure.csproj `
            --startup-project backend/src/PCS.API/PCS.API.csproj `
            --context PCSDbContext --configuration Release
          if ($LASTEXITCODE -ne 0) { throw "Migration failed" }
          Remove-Item Env:Database__Provider, Env:ConnectionStrings__DefaultConnection, Env:Jwt__Secret

          # Same arguments the launcher uses.
          $proc = Start-Process -FilePath (Join-Path $backendDir "PCS.API.exe") `
            -ArgumentList '--urls "http://localhost:5000"' `
            -WorkingDirectory $backendDir -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput (Join-Path $installRoot "api.out.log") `
            -RedirectStandardError (Join-Path $installRoot "api.err.log")

          try {
            $ready = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Seconds 2
              try {
                $r = Invoke-WebRequest "http://localhost:5000/health/ready" -UseBasicParsing
                if ($r.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
              if ($proc.HasExited) { break }
            }
            if (-not $ready) { throw "API did not become ready" }

            $index = Invoke-WebRequest "http://localhost:5000/" -UseBasicParsing
            if ($index.Content -notmatch 'id="root"') { throw "Frontend index.html was not served at /" }

            $spa = Invoke-WebRequest "http://localhost:5000/some/client/route" -UseBasicParsing
            if ($spa.Content -notmatch 'id="root"') { throw "SPA fallback did not serve index.html" }

            $body = @{ username = "admin"; password = $adminPassword } | ConvertTo-Json
            $login = Invoke-WebRequest "http://localhost:5000/api/auth/login" -Method Post -Body $body -ContentType "application/json" -UseBasicParsing
            if ($login.StatusCode -ne 200) { throw "Admin login failed" }

            $persisted = Get-Content (Join-Path $backendDir "appsettings.json") -Raw | ConvertFrom-Json
            if ($persisted.InitialAdmin.Password) { throw "Bootstrap admin password was not scrubbed from appsettings.json" }

            Write-Host "Installed-layout smoke test passed."
          }
          finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            foreach ($log in "api.out.log", "api.err.log") {
              $path = Join-Path $installRoot $log
              if (Test-Path $path) { Write-Host "--- $log"; Get-Content $path -Tail 40 }
            }
          }

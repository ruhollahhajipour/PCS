name: CI

on:
  push:
    branches: [ "feature/project-planning-architecture", "develop", "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No preview auth bypass in source
        run: ./scripts/check-no-auth-bypass.sh

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore backend/PCS.Backend.slnx
      - name: Build
        run: dotnet build backend/PCS.Backend.slnx --no-restore -c Release
      - name: Test
        run: dotnet test backend/tests/PCS.Application.Tests --no-build -c Release --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/tests/**/TestResults/*.trx

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # --legacy-peer-deps: npm's resolver crashes on vitest's optional peers with vite 8.
      - run: npm ci --legacy-peer-deps
      - name: Type check and build
        run: npm run build
      # Known baseline failures (see docs/audit/BASELINE.md). Reported but not blocking yet;
      # remove continue-on-error once they are fixed.
      - name: Unit tests
        run: npx vitest run
        continue-on-error: true
      - name: Lint
        run: npx eslint .
        continue-on-error: true
